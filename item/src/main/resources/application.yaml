server:
  port: ${SERVER_PORT}
  tomcat:
    accept-count: 200
    max-connections: 8192

spring:
  application:
    name: item
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: item-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 15

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

flyway:
  enabled: true
  locations: classpath:db/migration
  baseline-on-migrate: false
  validate-on-migrate: true

asset:
  cdn-base-url: ${ASSET_CDN_BASE_URL:https://d24c6my56k1w5v.cloudfront.net}

grpc:
  default-deadline-ms: 3000
  server:
    port: ${GRPC_SERVER_PORT}
    reflection-service-enabled: ${GRPC_REFLECTION_ENABLED:false}

  client:
    user:
      address: ${USER_GRPC_ADDRESS}
      negotiationType: plaintext
    character:
      address: ${CHARACTER_GRPC_ADDRESS}
      negotiationType: plaintext
    mission:
      address: ${MISSION_GRPC_ADDRESS}
      negotiationType: plaintext
    ai:
      address: ${AI_GRPC_ADDRESS}
      negotiationType: plaintext
    event-log:
      address: ${EVENT_LOG_GRPC_ADDRESS}
      negotiationType: plaintext

internal:
  grpc-auth:
    enabled: ${INTERNAL_GRPC_AUTH_ENABLED:true}
    token: ${INTERNAL_GRPC_AUTH_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: true

item:
  purchase-wallet:
    deadline-ms: ${ITEM_PURCHASE_WALLET_DEADLINE_MS:1000}