server:
  port: ${SERVER_PORT}

spring:
  application:
    name: item

  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

flyway:
  enabled: true
  locations: classpath:db/migration
  baseline-on-migrate: false
  validate-on-migrate: true

asset:
  cdn-base-url: ${ASSET_CDN_BASE_URL:https://d24c6my56k1w5v.cloudfront.net}

grpc:
  default-deadline-ms: 3000
  server:
    port: ${GRPC_SERVER_PORT}
    reflection-service-enabled: ${GRPC_REFLECTION_ENABLED:false}

  client:
    user:
      address: ${USER_GRPC_ADDRESS}
      negotiationType: plaintext
    character:
      address: ${CHARACTER_GRPC_ADDRESS}
      negotiationType: plaintext
    mission:
      address: ${MISSION_GRPC_ADDRESS}
      negotiationType: plaintext
    ai:
      address: ${AI_GRPC_ADDRESS}
      negotiationType: plaintext
    event-log:
      address: ${EVENT_LOG_GRPC_ADDRESS}
      negotiationType: plaintext

internal:
  grpc-auth:
    enabled: ${INTERNAL_GRPC_AUTH_ENABLED:true}
    token: ${INTERNAL_GRPC_AUTH_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: true

item:
  purchase-wallet:
    deadline-ms: ${ITEM_PURCHASE_WALLET_DEADLINE_MS:1000}