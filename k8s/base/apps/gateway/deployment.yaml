apiVersion: apps/v1
kind: Deployment
metadata:
  name: p5laris-gateway
  labels:
    app: p5laris-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: p5laris-gateway
  template:
    metadata:
      labels:
        app: p5laris-gateway
    spec:
      containers:
        - name: gateway
          image: p5laris-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms64m -Xmx320m -XX:+UseSerialGC -XX:ActiveProcessorCount=1 -XX:MaxDirectMemorySize=96m"
          envFrom:
            - configMapRef:
                name: p5laris-config
            - secretRef:
                name: p5laris-secret
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 160Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
