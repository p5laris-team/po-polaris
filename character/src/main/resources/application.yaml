server:
  port: ${SERVER_PORT}

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:character/.env[.properties]

  application:
    name: character

  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

flyway:
  enabled: true
  locations: classpath:db/migration
  baseline-on-migrate: false
  validate-on-migrate: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [traceId=%X{traceId}] %logger{36} - %msg%n"

grpc:
  default-deadline-ms: 3000
  server:
    port: ${GRPC_SERVER_PORT}
    reflection-service-enabled: ${GRPC_REFLECTION_ENABLED:false}

  client:
    user:
      address: ${USER_GRPC_ADDRESS}
      negotiationType: plaintext
    item:
      address: ${ITEM_GRPC_ADDRESS}
      negotiationType: plaintext
    ai:
      address: ${AI_GRPC_ADDRESS}
      negotiationType: plaintext
    # notification 모듈에 앱 내부 알림 생성 및 FCM 발송을 위임할 때 사용하는 gRPC 주소입니다.
    notification:
      address: ${NOTIFICATION_GRPC_ADDRESS}
      negotiationType: plaintext
    event-log:
      address: ${EVENT_LOG_GRPC_ADDRESS}
      negotiationType: plaintext

internal:
  grpc-auth:
    enabled: ${INTERNAL_GRPC_AUTH_ENABLED:true}
    token: ${INTERNAL_GRPC_AUTH_TOKEN:}

character:
  state-notification:
    # 활성 캐릭터의 상태 감소를 점검하고 CARE 알림을 요청할지 여부입니다.
    enabled: ${CHARACTER_STATE_NOTIFICATION_ENABLED}
    fixed-delay-ms: ${CHARACTER_STATE_NOTIFICATION_FIXED_DELAY_MS}
    initial-delay-ms: ${CHARACTER_STATE_NOTIFICATION_INITIAL_DELAY_MS}
    batch-size: ${CHARACTER_STATE_NOTIFICATION_BATCH_SIZE}
  share-reward-outbox:
    enabled: ${CHARACTER_SHARE_REWARD_OUTBOX_ENABLED:true}
    fixed-delay-ms: ${CHARACTER_SHARE_REWARD_OUTBOX_FIXED_DELAY_MS:60000}
    initial-delay-ms: ${CHARACTER_SHARE_REWARD_OUTBOX_INITIAL_DELAY_MS:10000}
    batch-size: ${CHARACTER_SHARE_REWARD_OUTBOX_BATCH_SIZE:100}
    max-attempts: ${CHARACTER_SHARE_REWARD_OUTBOX_MAX_ATTEMPTS:10}
    processing-timeout-seconds: ${CHARACTER_SHARE_REWARD_OUTBOX_PROCESSING_TIMEOUT_SECONDS:120}
    retry-initial-delay-seconds: ${CHARACTER_SHARE_REWARD_OUTBOX_RETRY_INITIAL_DELAY_SECONDS:60}
    retry-max-delay-seconds: ${CHARACTER_SHARE_REWARD_OUTBOX_RETRY_MAX_DELAY_SECONDS:1800}
  share-reward-wallet:
    deadline-ms: ${CHARACTER_SHARE_REWARD_WALLET_DEADLINE_MS}
  item-grpc:
    deadline-ms: ${CHARACTER_ITEM_GRPC_DEADLINE_MS}

cloud:
  aws:
    region: ${AWS_REGION}
    s3:
      bucket-name: ${S3_BUCKET_NAME}
      public-domain: ${S3_PUBLIC_DOMAIN}
      cors:
        enabled: ${S3_CORS_AUTO_CONFIGURE}
        allowed-origins: ${S3_CORS_ALLOWED_ORIGINS}

app:
  public-base-url: ${APP_PUBLIC_BASE_URL}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: true
