server:
  port: ${SERVER_PORT}

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:notification/.env[.properties]

  application:
    name: notification

  kafka:
    # 카프카 브로커 접속 주소 (로컬 포트 9097 등 환경 변수 연동)
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      # 알림 푸시용 컨슈머 그룹 ID 설정
      group-id: notification-group
      # 오프셋 정보가 없을 때 가장 처음(earliest)부터 메시지를 수신하도록 설정
      auto-offset-reset: earliest
      # 메시지 Key 역직렬화 클래스 (멱등키 String)
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        # 역직렬화 시 신뢰할 수 있는 패키지 범위 지정 (와일드카드 허용)
        spring.json.trusted.packages: "*"

  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none

    properties:
      hibernate:
        format_sql: true

flyway:
  enabled: true
  locations: classpath:db/migration
  baseline-on-migrate: false
  validate-on-migrate: true

grpc:
  server:
    port: ${GRPC_SERVER_PORT}
    reflection-service-enabled: ${GRPC_REFLECTION_ENABLED:false}

  client:
    event-log:
      address: ${EVENT_LOG_GRPC_ADDRESS}
      negotiationType: plaintext

internal:
  grpc-auth:
    enabled: ${INTERNAL_GRPC_AUTH_ENABLED:true}
    token: ${INTERNAL_GRPC_AUTH_TOKEN:}

firebase:
  credentials:
    base64: ${FIREBASE_CREDENTIALS_BASE64:}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: true
