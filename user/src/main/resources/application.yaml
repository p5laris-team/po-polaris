server:
  port: ${SERVER_PORT}

spring:
  application:
    name: user

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none

    properties:
      hibernate:
        format_sql: true

flyway:
  enabled: true
  locations: classpath:db/migration
  baseline-on-migrate: false
  validate-on-migrate: true

grpc:
  default-deadline-ms: 3000
  server:
    port: ${GRPC_SERVER_PORT}
    reflection-service-enabled: ${GRPC_REFLECTION_ENABLED:false}

  client:
    character:
      address: ${CHARACTER_GRPC_ADDRESS}
      negotiationType: plaintext
    item:
      address: ${ITEM_GRPC_ADDRESS}
      negotiationType: plaintext
    mission:
      address: ${MISSION_GRPC_ADDRESS}
      negotiationType: plaintext
    ai:
      address: ${AI_GRPC_ADDRESS}
      negotiationType: plaintext
    event-log:
      address: ${EVENT_LOG_GRPC_ADDRESS}
      negotiationType: plaintext
    notification:
      address: ${NOTIFICATION_GRPC_ADDRESS}
      negotiationType: plaintext

internal:
  grpc-auth:
    enabled: ${INTERNAL_GRPC_AUTH_ENABLED:true}
    token: ${INTERNAL_GRPC_AUTH_TOKEN:}

jwt:
  secret: ${JWT_SECRET}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS}

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: true
