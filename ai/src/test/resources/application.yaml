server:
  port: 0

spring:
  application:
    name: ai

  kafka:
    bootstrap-servers: localhost:9097
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: 1000
        request.timeout.ms: 1000
        delivery.timeout.ms: 2000
      retries: 0

  ai:
    model:
      chat: none
      embedding:
        text: none
    google:
      genai:
        api-key: test-gemini-api-key
        chat:
          options:
            model: gemini-2.0-flash
            response-mime-type: application/json
            temperature: 0.2
            max-output-tokens: 1024
            thinking-budget: 0
            include-thoughts: false
        embedding:
          api-key: test-gemini-api-key
          text:
            options:
              model: gemini-embedding-001
              dimensions: 768

  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      timeout: 2s
      repositories:
        enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5432/po_ai
    driver-class-name: org.postgresql.Driver
    username: root
    password: 12345678

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

grpc:
  default-deadline-ms: 3000
  server:
    port: 0
    reflection-service-enabled: false
  client:
    user:
      address: static://localhost:9091
      negotiationType: plaintext
    character:
      address: static://localhost:9092
      negotiationType: plaintext
    item:
      address: static://localhost:9093
      negotiationType: plaintext
    mission:
      address: static://localhost:9094
      negotiationType: plaintext
    event-log:
      address: static://localhost:9099
      negotiationType: plaintext

internal:
  grpc-auth:
    enabled: true
    token: test-internal-grpc-token

ai:
  provider:
    enabled: false
    type: rule-based
    model: gemini-2.0-flash
  embedding:
    enabled: false
    model: gemini-embedding-001
    dimension: 768
  rate-limit:
    enabled: false
    backend: memory
    provider-requests-per-minute: 60
    user-requests-per-minute: 10
    window-seconds: 60
    key-ttl-seconds: 120
    fail-closed: false
  circuit-breaker:
    enabled: false
    sliding-window-size: 10
    minimum-number-of-calls: 5
    failure-rate-threshold: 50
    slow-call-duration-ms: 3000
    slow-call-rate-threshold: 50
    wait-duration-open-ms: 30000
  character-talk:
    max-user-message-length: 300
    max-reply-length: 350
    tool-deadline-ms: 2500
    session-ttl-minutes: 30
    history-max-turns: 6
    memory-search-top-k: 3
    memory-similarity-threshold: 0.0
    message-retention-hours: 24
    session-retention-days: 30
    cleanup-enabled: false
    cleanup-fixed-delay-ms: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: true
