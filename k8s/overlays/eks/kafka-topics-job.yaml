apiVersion: batch/v1
kind: Job
metadata:
  name: p5laris-kafka-topics
  namespace: p5laris-lab
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: kafka-topics
          image: apache/kafka:3.7.0
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: p5laris-config
                  key: KAFKA_BOOTSTRAP_SERVERS
          command:
            - sh
            - -lc
            - |
              set -eu

              KAFKA_TOPICS="/opt/kafka/bin/kafka-topics.sh"

              for topic in \
                item-purchase-requested \
                item-purchase-requested.DLT \
                star-piece-spent \
                star-piece-spent.DLT \
                star-piece-spend-failed \
                star-piece-spend-failed.DLT \
                star-piece-earn-requested \
                star-piece-earn-requested.DLT \
                star-piece-earned \
                star-piece-earned.DLT \
                star-piece-earn-failed \
                star-piece-earn-failed.DLT \
                mission-character-exp-requested \
                mission-character-exp-requested.DLT \
                mission-character-exp-granted \
                mission-character-exp-granted.DLT \
                mission-character-exp-failed \
                mission-character-exp-failed.DLT \
                notification-requests \
                notification-requests.DLT \
                user-event-logs \
                user-event-logs.DLT \
                item-event-logs \
                item-event-logs.DLT \
                character-event-logs \
                character-event-logs.DLT \
                mission-event-logs \
                mission-event-logs.DLT \
                ai-event-logs \
                ai-event-logs.DLT
              do
                echo "== ensure topic: ${topic} =="

                "${KAFKA_TOPICS}" \
                  --bootstrap-server "${KAFKA_BOOTSTRAP_SERVERS}" \
                  --create \
                  --if-not-exists \
                  --topic "${topic}" \
                  --partitions 3 \
                  --replication-factor 2
              done

              echo
              echo "== topic list =="
              "${KAFKA_TOPICS}" \
                --bootstrap-server "${KAFKA_BOOTSTRAP_SERVERS}" \
                --list \
                | sort
