services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-broker
    ports:
      - "9097:9097"
      - "9096:9096"
    environment:
      # KRaft 모드 설정
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_K8S:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9097,PLAINTEXT_K8S://host.docker.internal:9096'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9097,PLAINTEXT_K8S://0.0.0.0:9096'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  kafka-topics-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-topics-init
    depends_on:
      - kafka
    command:
      - bash
      - -lc
      - |
        set -euo pipefail

        until kafka-topics --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do
          echo "waiting for kafka..."
          sleep 2
        done

        for topic in \
          item-purchase-requested \
          item-purchase-requested.DLT \
          star-piece-spent \
          star-piece-spent.DLT \
          star-piece-spend-failed \
          star-piece-spend-failed.DLT \
          star-piece-earn-requested \
          star-piece-earn-requested.DLT \
          star-piece-earned \
          star-piece-earned.DLT \
          star-piece-earn-failed \
          star-piece-earn-failed.DLT \
          mission-character-exp-requested \
          mission-character-exp-requested.DLT \
          mission-character-exp-granted \
          mission-character-exp-granted.DLT \
          mission-character-exp-failed \
          mission-character-exp-failed.DLT \
          notification-requests \
          notification-requests.DLT \
          user-event-logs \
          user-event-logs.DLT \
          item-event-logs \
          item-event-logs.DLT \
          character-event-logs \
          character-event-logs.DLT \
          mission-event-logs \
          mission-event-logs.DLT \
          ai-event-logs \
          ai-event-logs.DLT
        do
          kafka-topics \
            --bootstrap-server kafka:29092 \
            --create \
            --if-not-exists \
            --topic "$${topic}" \
            --partitions 3 \
            --replication-factor 1
        done

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka


