server:
  port: 0
  tomcat:
    accept-count: 200
    max-connections: 8192

spring:
  application:
    name: item
  kafka:
    bootstrap-servers: localhost:9097
    listener:
      auto-startup: false
    consumer:
      group-id: item-test-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  datasource:
    url: jdbc:postgresql://localhost:5432/po_item_test
    driver-class-name: org.postgresql.Driver
    username: root
    password: 12345678
    hikari:
      maximum-pool-size: 4

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false

flyway:
  enabled: true
  locations: classpath:db/migration
  baseline-on-migrate: false
  validate-on-migrate: true

asset:
  cdn-base-url: https://d24c6my56k1w5v.cloudfront.net

grpc:
  default-deadline-ms: 3000
  server:
    port: 0
    reflection-service-enabled: false
  client:
    user:
      address: static://localhost:19091
      negotiationType: plaintext
    character:
      address: static://localhost:19092
      negotiationType: plaintext
    mission:
      address: static://localhost:19093
      negotiationType: plaintext
    ai:
      address: static://localhost:19094
      negotiationType: plaintext
    event-log:
      address: static://localhost:19095
      negotiationType: plaintext

internal:
  grpc-auth:
    enabled: true
    token: test-internal-grpc-token

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: true

item:
  purchase-wallet:
    deadline-ms: 1000
