apiVersion: v1
kind: ConfigMap
metadata:
  name: p5laris-config
data:
  APP_PUBLIC_BASE_URL: "https://api.p5laris.life"
  S3_CORS_ALLOWED_ORIGINS: "https://p5laris.life,https://www.p5laris.life"

  REDIS_HOST: "p5laris-dev-redis.0rvwiu.0001.apn2.cache.amazonaws.com"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "b-1.p5larisdevmsk.ib1ak9.c3.kafka.ap-northeast-2.amazonaws.com:9092,b-2.p5larisdevmsk.ib1ak9.c3.kafka.ap-northeast-2.amazonaws.com:9092"

  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "0"
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "10000"
  SPRING_FLYWAY_CONNECT_RETRIES: "10"